name: Kayser Cloud Collector
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch: {}
  push:
    branches: [ main ]
permissions:
  contents: write
concurrency:
  group: collect
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Collect
        run: python3 collector.py
      - name: Commit
        run: |
          git config user.name "kayser-cloud-bot"
          git config user.email "bot@kayser.cloud"
          git pull --rebase || true
          git add -A
          git commit -m "collect $(date -u +%FT%TZ)" || echo "nichts neu"
          git push
